<title id="t">Featured Projects</title>
<desc id="d">Section title "Featured Projects": its letters rise in one by one, a thin gradient rule draws in, and a soft light sweeps across the text every 6 seconds. Icon: 2x2 project grid whose highlight steps from tile to tile.</desc>
