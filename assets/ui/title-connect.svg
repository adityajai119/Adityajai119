<svg xmlns="http://www.w3.org/2000/svg" width="960" height="72" viewBox="0 0 960 72" role="img" aria-labelledby="t d">
<title id="t">Connect with Me</title>
<desc id="d">Section title "Connect with Me": its letters rise in one by one, a thin gradient rule draws in, and a soft light sweeps across the text every 6 seconds. Icon: node broadcasting signal arcs; a ping ripples out and lights them in turn.</desc>
