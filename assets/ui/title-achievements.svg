<title id="t">Achievements</title>
<desc id="d">Section title "Achievements": its letters rise in one by one, a thin gradient rule draws in, and a soft light sweeps across the text every 6 seconds. Icon: ribboned medal with a star, swaying from the ribbon.</desc>
