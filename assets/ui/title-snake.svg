<svg xmlns="http://www.w3.org/2000/svg" width="960" height="72" viewBox="0 0 960 72" role="img" aria-labelledby="t d">
<title id="t">Contribution Snake</title>
<desc id="d">Section title "Contribution Snake": its letters rise in one by one, a thin gradient rule draws in, and a soft light sweeps across the text every 6 seconds. Icon: snake slithering a closed loop through a contribution grid.</desc>
